<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101311">
<title>GitHub Command Center — v1.0</title>
<style>
:root{color-scheme:dark;--bg:#0d100f;--panel:#141917;--panel2:#191f1c;--panel3:#202823;--text:#eef4ef;--muted:#95a39a;--line:#2a342d;--accent:#57e389;--accent2:#b1ffca;--danger:#ff7777;--warn:#f4c96b;--blue:#80b7ff;--shadow:0 18px 60px #0003}
[data-theme="light"]{color-scheme:light;--bg:#f4f7f4;--panel:#fff;--panel2:#f5f8f5;--panel3:#eaf0eb;--text:#17221a;--muted:#627167;--line:#dce5dd;--accent:#168548;--accent2:#dff9e8;--danger:#c63f3f;--warn:#946500;--blue:#286fbd;--shadow:0 18px 60px #17301a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{min-height:100vh;display:grid;grid-template-columns:252px minmax(0,1fr)}.sidebar{border-right:1px solid var(--line);background:var(--panel);padding:22px 14px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brandmark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--accent);color:#092012;font-size:21px;font-weight:900}.brand strong{font-size:14px;letter-spacing:-.3px;display:block}.brand small{color:var(--muted);font-size:11px}.navlabel{padding:0 12px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:600;font-size:13px}.nav button:hover{background:var(--panel2);color:var(--text)}.nav button.active{background:var(--accent2);color:var(--accent);box-shadow:inset 3px 0 var(--accent)}.nav .ico{width:19px;text-align:center;font-size:16px}.nav .count{margin-left:auto;background:var(--panel3);padding:1px 7px;border-radius:20px;font-size:10px}.sidebarbottom{margin-top:auto}.profile{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px}.avatar{height:34px;width:34px;border-radius:10px;background:linear-gradient(135deg,#6ee7a1,#317e54);color:#082312;display:grid;place-items:center;font-weight:900}.profile b{font-size:12px;display:block}.profile small{font-size:11px;color:var(--muted)}
main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:18px;background:color-mix(in srgb,var(--bg) 90%,transparent);position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}.crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--text)}.topactions{display:flex;align-items:center;gap:9px}.searchbox{width:min(280px,30vw);display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted)}.searchbox input{border:0;outline:0;background:transparent;color:var(--text);width:100%;min-width:0}.kbd{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;white-space:nowrap}.iconbtn,.btn{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:9px 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650}.iconbtn{width:38px;height:38px;padding:0}.btn:hover,.iconbtn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#082012}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn.small{padding:6px 9px;font-size:12px}.content{padding:30px 34px 60px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}.pagehead h1{font-size:clamp(25px,3vw,34px);line-height:1.15;letter-spacing:-1.1px;margin:7px 0 8px}.pagehead p{color:var(--muted);margin:0;max-width:650px}.headactions{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}.stathead{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:600}.staticon{width:32px;height:32px;border-radius:9px;background:var(--panel3);display:grid;place-items:center;font-size:16px}.statnum{font-size:29px;font-weight:800;letter-spacing:-1px;margin:14px 0 3px}.statfoot{font-size:11px;color:var(--muted)}.positive{color:var(--accent)}.twocol{grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr)}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.sectiontitle h2{font-size:15px;margin:0;letter-spacing:-.3px}.sectiontitle span{color:var(--muted);font-size:11px}.repo-list,.activity-list{display:grid;gap:0}.repo{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.repo:last-child,.activity:last-child{border-bottom:0;padding-bottom:0}.repo:first-child,.activity:first-child{padding-top:0}.repoicon{width:38px;height:38px;border-radius:10px;background:var(--panel3);display:grid;place-items:center;font-size:17px;flex-shrink:0}.repo-main{min-width:0;flex:1}.repo-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.repo-main small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);padding:3px 7px;border-radius:20px;font-size:10px;color:var(--muted);white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}.activity{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.activity .bullet{width:28px;height:28px;border-radius:8px;background:var(--panel3);display:grid;place-items:center;flex-shrink:0}.activity b{font-size:12px}.activity p{margin:3px 0;color:var(--muted);font-size:11px}.activity time{color:var(--muted);font-size:10px}.quickgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.quick{padding:16px;display:flex;gap:12px;align-items:flex-start;transition:transform .15s,border-color .15s;cursor:pointer}.quick:hover{transform:translateY(-2px);border-color:var(--accent)}.quick .qico{width:38px;height:38px;display:grid;place-items:center;background:var(--panel3);border-radius:10px;font-size:18px;flex-shrink:0}.quick b{font-size:12px;display:block}.quick small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.tools-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:17px}.toolnav{align-self:start}.toolnav button{display:block;width:100%;border:0;background:transparent;color:var(--muted);padding:10px 11px;text-align:left;border-radius:8px;margin-bottom:3px}.toolnav button.active,.toolnav button:hover{background:var(--panel3);color:var(--text)}.toolnav span{margin-right:9px}.toolpanel h2{margin:0 0 5px;font-size:19px}.toolpanel>p{color:var(--muted);margin:0 0 20px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field textarea,.field select,.inlineinput{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none}.field textarea{min-height:115px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}.help{font-size:11px;color:var(--muted)}.output{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}.outputhead{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}pre.outputtext{margin:0;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:440px;overflow:auto;color:var(--text);font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}.outputtext:empty:before{content:"Your generated output will appear here.";color:var(--muted)}.actionrow{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 18px}.notice{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12px;margin-bottom:16px}.notice strong{color:var(--text)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:500px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px}.table th{color:var(--muted);font-weight:700}.table td{color:var(--text)}.empty{text-align:center;padding:34px;color:var(--muted)}.meter{height:6px;background:var(--panel3);border-radius:9px;overflow:hidden;margin-top:8px}.meter span{display:block;height:100%;background:var(--accent);border-radius:9px}.healthrow{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.healthrow:last-child{border:0}.healthrow strong{font-size:12px}.healthrow small{display:block;color:var(--muted);margin-top:3px}.score{font-size:13px;font-weight:800;color:var(--accent)}.split{display:grid;grid-template-columns:1fr 1fr;gap:15px}.footer{padding:20px 0;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:30px}.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:20;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.mobilemenu{display:none}.hidden{display:none!important}
@media(max-width:1050px){.app{grid-template-columns:220px minmax(0,1fr)}.content{padding:25px 22px}.topbar{padding:0 22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.tools-layout{grid-template-columns:180px minmax(0,1fr)}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;left:-270px;top:0;width:252px;z-index:15;transition:left .2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobilemenu{display:inline-flex}.topbar{height:62px;padding:0 14px}.content{padding:22px 14px 42px}.searchbox{width:min(180px,40vw)}.searchbox .kbd{display:none}.pagehead{display:block}.headactions{margin-top:16px}.stats{gap:10px}.card{padding:14px}.statnum{font-size:25px}.quickgrid{grid-template-columns:1fr}.tools-layout{grid-template-columns:1fr}.toolnav{display:flex;gap:5px;overflow:auto;padding-bottom:5px}.toolnav button{white-space:nowrap;width:auto;flex-shrink:0}.formgrid,.split{grid-template-columns:1fr}.hide-mobile{display:none}.footer{display:block}.footer span{display:block;margin-top:5px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark">⌘</div><div><strong>COMMAND CENTER</strong><small>GitHub toolkit · v1.0</small></div></div>
  <div><div class="navlabel">Workspace</div><nav class="nav" id="mainNav">
    <button class="active" data-page="dashboard"><span class="ico">◫</span>Dashboard</button>
    <button data-page="repositories"><span class="ico">⑂</span>Repositories <span class="count">Demo</span></button>
    <button data-page="issues"><span class="ico">◎</span>Issues & PRs</button>
    <button data-page="health"><span class="ico">⌁</span>Repository health</button>
  </nav></div>
  <div><div class="navlabel">Developer tools</div><nav class="nav" id="toolNav">
    <button data-page="tools" data-tool="readme"><span class="ico">▤</span>README Studio</button>
    <button data-page="tools" data-tool="gitignore"><span class="ico">⊘</span>.gitignore Builder</button>
    <button data-page="tools" data-tool="license"><span class="ico">⚖</span>License Generator</button>
    <button data-page="tools" data-tool="changelog"><span class="ico">↻</span>Changelog Builder</button>
    <button data-page="tools" data-tool="json"><span class="ico">{ }</span>JSON Formatter</button>
    <button data-page="tools" data-tool="yaml"><span class="ico">≋</span>YAML Checker</button>
    <button data-page="tools" data-tool="git"><span class="ico">⌘</span>Git Command Builder</button>
    <button data-page="tools" data-tool="workflow"><span class="ico">⇄</span>Actions Workflow</button>
  </nav></div>
  <div class="sidebarbottom"><div class="notice"><strong>Prototype mode</strong><br>Local demo data only. Connect GitHub in Phase 2.</div><div class="profile"><div class="avatar">CC</div><div><b>Local workspace</b><small>Not connected to GitHub</small></div></div></div>
</aside>
<main>
<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="iconbtn mobilemenu" id="menuBtn" aria-label="Open menu">☰</button><div class="crumb">Workspace / <strong id="crumb">Dashboard</strong></div></div><div class="topactions"><label class="searchbox"><span>⌕</span><input id="globalSearch" placeholder="Search tools & pages…" aria-label="Search tools and pages"><span class="kbd">/</span></label><button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☼</button><button class="btn primary hide-mobile" id="quickTool">＋ Quick tool</button></div></header>
<div class="content" id="content"></div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={page:"dashboard",tool:"readme",theme:"dark",search:"",repoFilter:"all",issuesFilter:"all",output:"",repoName:""};
const demoRepos=[
{name:"zen-quest",owner:"digitaldairy786",desc:"Gamified wellness experience built with React and Firebase.",lang:"TypeScript",stars:24,forks:6,issues:3,private:false,updated:"2 hours ago",color:"#61dafb"},
{name:"devgenerator-os",owner:"digitaldairy786",desc:"A modular collection of browser-based developer generators.",lang:"JavaScript",stars:18,forks:4,issues:5,private:false,updated:"yesterday",color:"#f1e05a"},
{name:"aviator.com",owner:"digitaldairy786",desc:"Progressive web app experiment and offline-ready web shell.",lang:"HTML",stars:7,forks:2,issues:1,private:false,updated:"3 days ago",color:"#e34c26"},
{name:"command-center",owner:"digitaldairy786",desc:"Developer productivity workspace prototype.",lang:"JavaScript",stars:12,forks:3,issues:2,private:false,updated:"just now",color:"#f1e05a"}
];
const demoIssues=[
{type:"issue",id:24,title:"Add keyboard shortcuts to tool navigation",repo:"command-center",label:"enhancement",status:"open",age:"2 hours ago"},
{type:"pr",id:18,title:"Improve responsive layout for small screens",repo:"devgenerator-os",label:"ui",status:"review",age:"yesterday"},
{type:"issue",id:11,title:"Document local-first architecture",repo:"command-center",label:"documentation",status:"open",age:"2 days ago"},
{type:"pr",id:9,title:"Add offline caching support",repo:"aviator.com",label:"feature",status:"merged",age:"4 days ago"},
{type:"issue",id:7,title:"Add onboarding checklist",repo:"zen-quest",label:"good first issue",status:"open",age:"1 week ago"}
];
const toolMeta={
readme:{title:"README Studio",sub:"Create a polished README.md starter for your repository.",icon:"▤"},
gitignore:{title:".gitignore Builder",sub:"Build a sensible ignore file by combining common development stacks.",icon:"⊘"},
license:{title:"License Generator",sub:"Generate a standard license text template for your project.",icon:"⚖"},
changelog:{title:"Changelog Builder",sub:"Turn release notes and commit summaries into a structured changelog.",icon:"↻"},
json:{title:"JSON Formatter & Validator",sub:"Pretty-print JSON, validate syntax, and compact payloads locally.",icon:"{ }"},
yaml:{title:"YAML Workflow Checker",sub:"Run practical text checks on GitHub Actions YAML before committing.",icon:"≋"},
git:{title:"Git Command Builder",sub:"Compose common Git commands with readable explanations.",icon:"⌘"},
workflow:{title:"GitHub Actions Studio",sub:"Generate a starter CI workflow for common project types.",icon:"⇄"}
};
function toast(msg){const el=$("#toast");el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2500)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setPage(page,tool){state.page=page;if(tool)state.tool=tool;$("#sidebar").classList.remove("open");render()}
function setTheme(theme){state.theme=theme;document.documentElement.dataset.theme=theme;$("#themeBtn").textContent=theme==="dark"?"☼":"☾";localStorage.setItem("cc-theme",theme)}
function button(label,action,cls="btn"){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function pageHead(kicker,title,desc,actions=""){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="headactions">${actions}</div></div>`}
function stat(label,num,foot,ico){return `<div class="card"><div class="stathead"><span>${label}</span><span class="staticon">${ico}</span></div><div class="statnum">${num}</div><div class="statfoot">${foot}</div></div>`}
function repoRow(r){return `<div class="repo"><div class="repoicon">⑂</div><div class="repo-main"><strong>${esc(r.owner)}/${esc(r.name)}</strong><small>${esc(r.desc)}</small></div><span class="tag"><span class="dot" style="background:${r.color}"></span>${esc(r.lang)}</span><span class="tag">★ ${r.stars}</span></div>`}
function activity(icon,title,desc,time){return `<div class="activity"><div class="bullet">${icon}</div><div style="flex:1"><b>${title}</b><p>${desc}</p><time>${time}</time></div></div>`}
function dashboard(){return `${pageHead("Developer workspace","Good work starts with a clear view.","Your local command center for repository work, quality checks, and everyday developer utilities.",button("Explore tools","goto-tools","btn primary")+button("View health report","goto-health","btn"))}
<div class="grid stats">${stat("Repositories","04","Sample workspace data","⑂")}${stat("Open issues","09","Across sample repositories","◎")}${stat("Pull requests","02","1 awaiting review","⇄")}${stat("Health checks","7/8","One recommended improvement","⌁")}</div>
<div class="grid twocol"><section class="card"><div class="sectiontitle"><h2>Repository overview</h2><button class="btn small ghost" data-action="goto-repositories">All repositories →</button></div><div class="repo-list">${demoRepos.slice(0,3).map(repoRow).join("")}</div></section><section class="card"><div class="sectiontitle"><h2>Recent activity</h2><span>Illustrative feed</span></div><div class="activity-list">${activity("↻","Workflow template updated","command-center · Local prototype","Just now")}${activity("✓","README draft generated","devgenerator-os · Local tool","Today")}${activity("⌁","Health scan completed","4 repositories · Demo scan","Today")}${activity("＋","Issue triage list reviewed","zen-quest · Sample data","Yesterday")}</div></section></div>
<section style="margin-top:18px"><div class="sectiontitle"><h2>Quick launch</h2><span>Tools run locally in your browser</span></div><div class="grid quickgrid">${quickCard("▤","README Studio","Generate a README.md starter.","readme")}${quickCard("{ }","JSON Formatter","Validate and format JSON.","json")}${quickCard("⇄","Actions Workflow","Create a CI workflow template.","workflow")}${quickCard("⊘",".gitignore Builder","Compose ignore patterns.","gitignore")}${quickCard("⌘","Git Command Builder","Build common Git commands.","git")}${quickCard("⌁","Repository Health","Review example quality checks.","health")}</div></section>
<div class="footer"><span>GitHub Command Center · v1.0 prototype</span><span>Demo data only · No GitHub account connected</span></div>`}
function quickCard(icon,title,desc,tool){return `<div class="card quick" data-open-tool="${tool}"><div class="qico">${icon}</div><div><b>${title}</b><small>${desc}</small></div><span style="margin-left:auto;color:var(--muted)">↗</span></div>`}
function repositories(){return `${pageHead("Workspace / repositories","Repositories","A sample repository list for testing search, filtering, and the health workflow.",button("＋ Add sample repo","add-repo","btn primary"))}<div class="notice"><strong>Prototype data:</strong> these entries are examples, not live repositories from your GitHub account.</div><div class="card"><div class="sectiontitle"><h2>All repositories</h2><select id="repoFilter" class="inlineinput" style="width:auto" aria-label="Filter repositories"><option value="all">All languages</option><option>JavaScript</option><option>TypeScript</option><option>HTML</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Repository</th><th>Language</th><th>Stars</th><th>Issues</th><th>Last activity</th><th></th></tr></thead><tbody id="repoTable">${repoTableRows()}</tbody></table></div></div>`}
function repoTableRows(){return demoRepos.filter(r=>state.repoFilter==="all"||r.lang===state.repoFilter).map(r=>`<tr><td><strong>⑂ ${esc(r.owner)}/${esc(r.name)}</strong><div class="help">${esc(r.desc)}</div></td><td><span class="dot" style="display:inline-block;background:${r.color};margin-right:6px"></span>${r.lang}</td><td>★ ${r.stars}</td><td>${r.issues}</td><td>${r.updated}</td><td><button class="btn small" data-repo-health="${r.name}">Inspect</button></td></tr>`).join("")||`<tr><td colspan="6" class="empty">No repositories match this filter.</td></tr>`}
function issues(){return `${pageHead("Workspace / triage","Issues & pull requests","Practice issue triage with a filterable sample queue.",button("Refresh demo data","refresh-issues","btn"))}<div class="notice"><strong>Not connected:</strong> issue and pull request rows below are mock data. Phase 2 will load real data with the required permissions.</div><div class="card"><div class="sectiontitle"><h2>Triage queue</h2><select id="issueFilter" class="inlineinput" style="width:auto"><option value="all">All items</option><option value="issue">Issues only</option><option value="pr">Pull requests only</option><option value="open">Open</option><option value="review">In review</option><option value="merged">Merged</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Type</th><th>Title</th><th>Repository</th><th>Label</th><th>Status</th><th>Updated</th></tr></thead><tbody id="issueTable">${issueRows()}</tbody></table></div></div>`}
function issueRows(){return demoIssues.filter(x=>state.issuesFilter==="all"||x.type===state.issuesFilter||x.status===state.issuesFilter).map(x=>`<tr><td>${x.type==="pr"?"⇄ PR":"◎ Issue"} #${x.id}</td><td><strong>${esc(x.title)}</strong></td><td>${esc(x.repo)}</td><td><span class="tag">${esc(x.label)}</span></td><td><span class="tag">${esc(x.status)}</span></td><td>${x.age}</td></tr>`).join("")||`<tr><td colspan="6" class="empty">No items match this filter.</td></tr>`}
function health(){const checks=[["README.md exists","Add a clear project overview and setup instructions.","pass"],["License file","Choose a license that fits your project.","pass"],[".gitignore","Avoid committing build outputs and local secrets.","pass"],["CI workflow","Run automated checks on pull requests.","warn"],["Dependency review","Review outdated or vulnerable dependencies.","pass"],["Secret scanning","Enable repository secret scanning where available.","pass"],["Contribution guide","Explain how contributors can help.","warn"],["Issue templates","Make bug reports and feature requests actionable.","pass"]];return `${pageHead("Quality center","Repository health","A lightweight local checklist that helps you spot common repository hygiene gaps.",button("Run scan","run-health","btn primary"))}<div class="grid stats">${stat("Checks passed","6","Example scan results","✓")}${stat("Recommendations","2","Review the suggested actions","⌁")}${stat("Coverage","75%","6 of 8 checklist items","◴")}${stat("Risk level","Low","Illustrative result only","◇")}</div><div class="grid twocol"><section class="card"><div class="sectiontitle"><h2>Checklist results</h2><span id="scanStatus">Last scan: demo</span></div><div id="healthChecks">${checks.map((c,i)=>`<div class="healthrow"><div><strong>${c[0]}</strong><small>${c[1]}</small></div><span class="tag">${c[2]==="pass"?"✓ Passed":"! Review"}</span></div>`).join("")}</div></section><section class="card"><div class="sectiontitle"><h2>Recommended next steps</h2><span>Prioritized</span></div>${activity("1","Add CI workflow","Use Actions Studio to generate a test workflow.","High impact")}${activity("2","Add contribution guide","Create a CONTRIBUTING.md for collaborators.","Good practice")}${activity("3","Review permissions","Use least-privilege permissions in automation.","Security")}</section></div><div class="notice" style="margin-top:16px">This checklist does not scan source code, dependencies, or secrets. A green status here is not a security guarantee.</div>`}
function toolShell(){const t=toolMeta[state.tool]||toolMeta.readme;return `${pageHead("Developer tools",t.title,t.sub,button("Back to dashboard","goto-dashboard","btn"))}<div class="tools-layout"><nav class="card toolnav">${Object.entries(toolMeta).map(([k,v])=>`<button data-tool="${k}" class="${state.tool===k?"active":""}"><span>${v.icon}</span>${v.title}</button>`).join("")}</nav><section class="card toolpanel">${toolBody(state.tool)}</section></div>`}
function field(label,id,placeholder="",value="",type="text"){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}"></div>`}
function area(label,id,placeholder="",value="",rows=7){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" rows="${rows}" placeholder="${placeholder}">${esc(value)}</textarea></div>`}
function selectField(label,id,options){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select></div>`}
function outputBlock(){return `<div class="output"><div class="outputhead"><span>Generated output</span><span>Local processing</span></div><pre class="outputtext" id="toolOutput"></pre></div>`}
function toolBody(k){let body="";
if(k==="readme")body=`<div class="formgrid">${field("Project name","rdName","my-awesome-project","My Project")}${field("Short description","rdDesc","What does it do?","A useful tool that makes development easier.")}${field("Repository URL (optional)","rdUrl","https://github.com/owner/repo")}${selectField("License","rdLicense",[["MIT","MIT"],["Apache-2.0","Apache 2.0"],["GPL-3.0","GPL 3.0"],["Unlicense","Unlicense"],["","Not specified"]])}</div>${area("Features (one per line)","rdFeatures","Fast and simple\\nAccessible interface\\nEasy to customize","Fast and simple\\nAccessible interface\\nEasy to customize",4)}${area("Installation / usage notes","rdUsage","Describe how to install and run your project.","",4)}<div class="actionrow"><button class="btn primary" data-action="generate-readme">Generate README</button><button class="btn" data-action="download-output">Download README.md</button></div>${outputBlock()}`;
if(k==="gitignore")body=`<div class="notice">Select the stacks you use. The builder combines common patterns; review the output before committing.</div><div class="formgrid"><div class="field"><label><input type="checkbox" class="ignoreChoice" value="node" checked> Node.js / npm</label><label><input type="checkbox" class="ignoreChoice" value="next" checked> Next.js</label><label><input type="checkbox" class="ignoreChoice" value="python"> Python</label><label><input type="checkbox" class="ignoreChoice" value="vscode"> VS Code workspace</label></div><div class="field"><label><input type="checkbox" class="ignoreChoice" value="mac" checked> macOS</label><label><input type="checkbox" class="ignoreChoice" value="windows"> Windows</label><label><input type="checkbox" class="ignoreChoice" value="env" checked> Environment files</label><label><input type="checkbox" class="ignoreChoice" value="logs" checked> Logs / build output</label></div></div><div class="actionrow"><button class="btn primary" data-action="generate-gitignore">Build .gitignore</button><button class="btn" data-action="download-output">Download .gitignore</button></div>${outputBlock()}`;
if(k==="license")body=`${field("Copyright holder / author","licAuthor","Your name or organization","Your Name")}${selectField("License template","licType",[["MIT","MIT License"],["Apache-2.0","Apache License 2.0"],["GPL-3.0","GNU GPL v3.0"],["BSD-3-Clause","BSD 3-Clause"],["Unlicense","The Unlicense"]])}<div class="actionrow"><button class="btn primary" data-action="generate-license">Generate license</button><button class="btn" data-action="download-output">Download LICENSE</button></div><div class="notice">This creates a standard template, not legal advice. Verify the license terms before publishing.</div>${outputBlock()}`;
if(k==="changelog")body=`${field("Version","clVersion","1.0.0","1.0.0")}${field("Release date","clDate","YYYY-MM-DD",new Date().toISOString().slice(0,10))}${area("Added (one item per line)","clAdded","New features…","Initial project release",3)}${area("Changed / fixed (one item per line)","clChanged","Improvements and fixes…","",3)}<div class="actionrow"><button class="btn primary" data-action="generate-changelog">Generate changelog</button><button class="btn" data-action="download-output">Download CHANGELOG.md</button></div>${outputBlock()}`;
if(k==="json")body=`${area("JSON input","jsonInput",'Paste JSON here, e.g. {"name":"Command Center","version":1}', '{"name":"Command Center","version":1}',10)}<div class="actionrow"><button class="btn primary" data-action="json-format">Format & validate</button><button class="btn" data-action="json-minify">Minify</button><button class="btn" data-action="json-clear">Clear</button><button class="btn" data-action="download-output">Download JSON</button></div><div id="jsonStatus" class="notice">Ready to validate. Processing stays in your browser.</div>${outputBlock()}`;
if(k==="yaml")body=`${area("YAML input","yamlInput","Paste a GitHub Actions workflow YAML file here.",'name: CI\\non:\\n  push:\\n    branches: [main]\\n  pull_request:\\njobs:\\n  build:\\n    runs-on: ubuntu-latest\\n    steps:\\n      - uses: actions/checkout@v4\\n      - name: Check files\\n        run: echo "Workflow syntax should be validated with a YAML parser"',12)}<div class="actionrow"><button class="btn primary" data-action="yaml-check">Check common issues</button><button class="btn" data-action="download-output">Download workflow.yml</button></div><div class="notice">This is a heuristic text check, not a full YAML parser or GitHub Actions validator.</div>${outputBlock()}`;
if(k==="git")body=`${selectField("Task","gitTask",[["clone","Clone a repository"],["new","Initialize a repository"],["branch","Create and switch to a branch"],["commit","Stage and commit changes"],["push","Push a branch to origin"],["pull","Pull latest changes"],["prune","Remove merged local branches"],["undo","Undo last commit but keep changes"]])}${field("Repository URL (for clone)","gitUrl","https://github.com/owner/repo")}${field("Branch name","gitBranch","feature/my-change","feature/my-change")}${field("Commit message","gitMessage","Describe your change","Update project") }<div class="actionrow"><button class="btn primary" data-action="generate-git">Build command</button><button class="btn" data-action="copy-output">Copy command</button></div>${outputBlock()}<div class="notice">Review commands before running them in your terminal. This tool only generates text; it does not execute Git commands.</div>`;
if(k==="workflow")body=`${selectField("Project type","wfType",[["node","Node.js"],["python","Python"],["static","Static HTML / GitHub Pages"],["next","Next.js"],["rust","Rust"]])}${selectField("Trigger","wfTrigger",[["pushpr","Push and pull requests"],["push","Push to main"],["manual","Manual workflow dispatch"],["release","Release published"]])}${field("Workflow filename","wfName","ci.yml","ci.yml")}${field("Main branch","wfBranch","main","main")}<div class="actionrow"><button class="btn primary" data-action="generate-workflow">Generate workflow</button><button class="btn" data-action="download-output">Download workflow YAML</button></div><div class="notice">Starter template only. Confirm runtime versions, scripts, permissions, and deployment settings for your project before use.</div>${outputBlock()}`;
return body}
function render(){const content=$("#content");content.innerHTML=state.page==="dashboard"?dashboard():state.page==="repositories"?repositories():state.page==="issues"?issues():state.page==="health"?health():toolShell();$("#crumb").textContent=state.page==="tools"?(toolMeta[state.tool]?.title||"Developer tools"):({dashboard:"Dashboard",repositories:"Repositories",issues:"Issues & PRs",health:"Repository health"}[state.page]);$$('#mainNav button,#toolNav button').forEach(b=>b.classList.toggle("active",b.dataset.page===state.page&&(state.page!=="tools"||b.dataset.tool===state.tool)));if(state.page==="tools"&&state.output){const out=$("#toolOutput");if(out)out.textContent=state.output}if($("#repoFilter"))$("#repoFilter").value=state.repoFilter;if($("#issueFilter"))$("#issueFilter").value=state.issuesFilter}
function setOutput(s){state.output=s;const el=$("#toolOutput");if(el)el.textContent=s}
function lines(id){return ($("#"+id)?.value||"").split("\n").map(x=>x.trim()).filter(Boolean)}
function generateReadme(){const name=$("#rdName").value.trim()||"Project Name",desc=$("#rdDesc").value.trim()||"A short description of this project.",url=$("#rdUrl").value.trim(),license=$("#rdLicense").value;const feats=lines("rdFeatures"),usage=$("#rdUsage").value.trim();return `# ${name}\n\n${desc}\n${url?`\n[Repository](${url})\n`:""}\n## Features\n${feats.length?feats.map(x=>`- ${x}`).join("\n"):"- Add your project features here."}\n\n## Getting started\n\n${usage||"Add installation and usage instructions here."}\n\n## Contributing\n\nContributions, issues, and feature requests are welcome. Please open an issue to discuss significant changes before submitting a pull request.\n\n## License\n\n${license?`This project is licensed under the ${license} license. Add a LICENSE file with the full terms.`:"Specify your project license here."}\n`}
const ignorePatterns={node:"node_modules/\\nnpm-debug.log*\\nyarn-debug.log*\\nyarn-error.log*\\npnpm-debug.log*",next:".next/\\nout/\\nbuild/\\nnext-env.d.ts",python:"__pycache__/\\n*.py[cod]\\n.venv/\\nvenv/\\n.pytest_cache/\\n",vscode:".vscode/*\\n!.vscode/extensions.json",mac:".DS_Store\\n.AppleDouble\\n.LSOverride",windows:"Thumbs.db\\nDesktop.ini\\n$RECYCLE.BIN/",env:".env\\n.env.*\\n!.env.example",logs:"*.log\\ncoverage/\\ndist/\\n"}
function genIgnore(){return [...new Set($$(".ignoreChoice:checked").flatMap(el=>ignorePatterns[el.value].split("\n")))].join("\n")+"\n"}
function generateLicense(){const year=new Date().getFullYear(),author=$("#licAuthor").value.trim()||"Your Name",type=$("#licType").value;let s="";
if(type==="MIT")s=`MIT License\n\nCopyright (c) ${year} ${author}\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the "Software"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n`;
else if(type==="Unlicense")s=`This is free and unencumbered software released into the public domain.\n\nCopyright (c) ${year} ${author}\n\nAnyone is free to copy, modify, publish, use, compile, sell, or distribute this\nsoftware, either in source code form or as a compiled binary, for any purpose,\ncommercial or non-commercial, and by any means.\n\nTHE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT.\n`;
else s=`${type==="Apache-2.0"?"Apache License\nVersion 2.0, January 2004\nhttp://www.apache.org/licenses/":type==="GPL-3.0"?"GNU GENERAL PUBLIC LICENSE\nVersion 3, 29 June 2007":"BSD 3-Clause License"}\n\nCopyright (c) ${year}, ${author}\n\n${type==="Apache-2.0"?"Licensed under the Apache License, Version 2.0 (the \"License\"); you may not use this file except in compliance with the License. You may obtain a copy of the License at the URL above. Unless required by applicable law or agreed to in writing, software distributed under the License is distributed on an \"AS IS\" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied. See the License for the specific language governing permissions and limitations under the License.":type==="GPL-3.0"?"This is a template header only. Include the complete GPL-3.0 license text from the official license source before distributing.":"Redistribution and use in source and binary forms, with or without modification, are permitted provided that the following conditions are met:\n\n1. Redistributions of source code must retain the above copyright notice, this list of conditions and the following disclaimer.\n2. Redistributions in binary form must reproduce the above copyright notice, this list of conditions and the following disclaimer in the documentation and/or other materials provided with the distribution.\n3. Neither the name of the copyright holder nor the names of its contributors may be used to endorse or promote products derived from this software without specific prior written permission.\n\nTHIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS \"AS IS\" AND ANY EXPRESS OR IMPLIED WARRANTIES ARE DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT HOLDER OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES."}\n`;
return s}
function generateChangelog(){const version=$("#clVersion").value.trim()||"Unreleased",date=$("#clDate").value||"Unreleased";return `# Changelog\n\nAll notable changes to this project will be documented in this file.\n\n## [${version}] - ${date}\n\n### Added\n${lines("clAdded").length?lines("clAdded").map(x=>`- ${x}`).join("\n"):"- No items listed."}\n\n### Changed / Fixed\n${lines("clChanged").length?lines("clChanged").map(x=>`- ${x}`).join("\n"):"- No items listed."}\n`}
function generateGit(){const task=$("#gitTask").value,branch=$("#gitBranch").value.trim()||"feature/my-change",url=$("#gitUrl").value.trim()||"https://github.com/owner/repo",msg=$("#gitMessage").value.trim().replace(/"/g,'\\"')||"Update project";const map={clone:`git clone ${url}`,new:"git init\ngit add .\ngit commit -m \"Initial commit\"",branch:`git switch -c ${branch}`,commit:`git add .\ngit commit -m "${msg}"`,push:`git push -u origin ${branch}`,pull:"git pull --ff-only",prune:"git branch --merged | grep -vE '^\\*|main|master' | xargs -r git branch -d",undo:"git reset --soft HEAD~1"};return map[task]}
function generateWorkflow(){const type=$("#wfType").value,trigger=$("#wfTrigger").value,branch=$("#wfBranch").value.trim()||"main";let on=trigger==="pushpr"?`push:\n    branches: [${branch}]\n  pull_request:\n    branches: [${branch}]`:trigger==="push"?`push:\n    branches: [${branch}]`:trigger==="manual"?"workflow_dispatch:":"release:\n    types: [published]";let steps="";
if(type==="node"||type==="next")steps=`      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n      - run: npm ci\n      - run: npm test --if-present\n      - run: npm run build --if-present`;
if(type==="python")steps=`      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - run: python -m pip install --upgrade pip\n      - run: if [ -f requirements.txt ]; then pip install -r requirements.txt; fi\n      - run: python -m compileall .`;
if(type==="static")steps=`      - uses: actions/checkout@v4\n      - name: Check required files\n        run: test -f index.html`;
if(type==="rust")steps=`      - uses: actions/checkout@v4\n      - uses: dtolnay/rust-toolchain@stable\n      - run: cargo fmt --all -- --check\n      - run: cargo test --all`;
return `name: ${$("#wfName").value.trim().replace(/\.ya?ml$/,"")||"CI"}\n\non:\n  ${on.replace(/\n/g,"\n  ")}\n\npermissions:\n  contents: read\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n${steps}\n`}
function checkYaml(){const v=$("#yamlInput").value,issues=[];if(!v.trim())issues.push("Input is empty.");if(!/^name\s*:/m.test(v))issues.push("Missing top-level name: field.");if(!/^on\s*:/m.test(v))issues.push("Missing top-level on: trigger.");if(!/^jobs\s*:/m.test(v))issues.push("Missing top-level jobs: section.");if(v.includes("\t"))issues.push("Tab character found; YAML indentation should use spaces.");if(/uses:\s*[^@\s]+@v\d+\s*$/m.test(v))issues.push("An action reference may use a floating major version; consider pinning a full commit SHA for stricter supply-chain security.");if(/pull_request_target/.test(v)&&/permissions:\s*write-all/.test(v))issues.push("Review elevated permissions carefully, especially for workflows triggered by external contributions.");if(!issues.length)issues.push("No obvious issues found by these basic text checks. This is not full YAML validation.");return issues.map((x,i)=>`${i+1}. ${x}`).join("\n")}
function runAction(a){switch(a){
case"goto-tools":setPage("tools","readme");break;case"goto-health":setPage("health");break;case"goto-dashboard":setPage("dashboard");break;case"goto-repositories":setPage("repositories");break;
case"generate-readme":setOutput(generateReadme());toast("README generated");break;
case"generate-gitignore":setOutput(genIgnore());toast(".gitignore generated");break;
case"generate-license":setOutput(generateLicense());toast("License template generated");break;
case"generate-changelog":setOutput(generateChangelog());toast("Changelog generated");break;
case"json-format":case"json-minify":{try{const data=JSON.parse($("#jsonInput").value);const compact=a==="json-minify";setOutput(JSON.stringify(data,null,compact?0:2));$("#jsonStatus").textContent="✓ Valid JSON. "+(compact?"Minified successfully.":"Formatted successfully.");$("#jsonStatus").style.color="var(--accent)";toast("Valid JSON")}catch(e){setOutput("");$("#jsonStatus").textContent="Invalid JSON: "+e.message;$("#jsonStatus").style.color="var(--danger)";toast("JSON validation failed")}break}
case"json-clear":$("#jsonInput").value="";setOutput("");$("#jsonStatus").textContent="Cleared.";break;
case"yaml-check":setOutput(checkYaml());toast("Basic checks complete");break;
case"generate-git":setOutput(generateGit());toast("Command generated");break;
case"generate-workflow":setOutput(generateWorkflow());toast("Workflow template generated");break;
case"copy-output":if(state.output){navigator.clipboard?.writeText(state.output).then(()=>toast("Copied to clipboard")).catch(()=>toast("Clipboard unavailable — select and copy output"));}else toast("Generate output first");break;
case"download-output":if(!state.output){toast("Generate output first");break}download(state.output,downloadName());break;
case"add-repo":demoRepos.unshift({name:"new-demo-project",owner:"local-workspace",desc:"A newly added sample repository.",lang:"JavaScript",stars:0,forks:0,issues:0,private:false,updated:"just now",color:"#f1e05a"});render();toast("Sample repository added");break;
case"refresh-issues":state.issuesFilter="all";render();toast("Demo queue refreshed");break;
case"run-health":$("#scanStatus").textContent="Scan completed just now";toast("Local checklist refreshed");break;
}}
function download(text,name){const blob=new Blob([text],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);toast("Download started: "+name)}
function downloadName(){return ({readme:"README.md",gitignore:".gitignore",license:"LICENSE",changelog:"CHANGELOG.md",json:"data.json",yaml:"workflow.yml",git:"git-commands.txt",workflow:($("#wfName")?.value||"ci.yml")})[state.tool]||"output.txt"}
document.addEventListener("click",e=>{const nav=e.target.closest("[data-page]");if(nav){setPage(nav.dataset.page,nav.dataset.tool);return}const tool=e.target.closest("[data-tool]");if(tool&&tool.dataset.page!=="tools"){setPage("tools",tool.dataset.tool);return}if(tool){state.tool=tool.dataset.tool;state.output="";render();return}const quick=e.target.closest("[data-open-tool]");if(quick){setPage("tools",quick.dataset.openTool);return}const repo=e.target.closest("[data-repo-health]");if(repo){setPage("health");toast("Showing general checklist for "+repo.dataset.repo);return}const act=e.target.closest("[data-action]");if(act)runAction(act.dataset.action)});
document.addEventListener("change",e=>{if(e.target.id==="repoFilter"){state.repoFilter=e.target.value;$("#repoTable").innerHTML=repoTableRows()}if(e.target.id==="issueFilter"){state.issuesFilter=e.target.value;$("#issueTable").innerHTML=issueRows()}});
$("#themeBtn").addEventListener("click",()=>setTheme(state.theme==="dark"?"light":"dark"));
$("#menuBtn").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
$("#quickTool").addEventListener("click",()=>setPage("tools","readme"));
$("#globalSearch").addEventListener("input",e=>{state.search=e.target.value.toLowerCase();const q=state.search;if(!q)return;const match=Object.entries(toolMeta).find(([k,v])=>v.title.toLowerCase().includes(q)||v.sub.toLowerCase().includes(q));if(match){$$("[data-tool]").forEach(b=>b.style.opacity=(b.dataset.tool===match[0]?"1":".45"))}else{$$("[data-tool]").forEach(b=>b.style.opacity="1")}});
$("#globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=e.target.value.toLowerCase();const match=Object.entries(toolMeta).find(([k,v])=>v.title.toLowerCase().includes(q));if(match)setPage("tools",match[0]);else if("dashboard".includes(q))setPage("dashboard");else if("repositories".includes(q))setPage("repositories");else if("health".includes(q))setPage("health")}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("#globalSearch").focus()}if(e.key==="Escape")$("#sidebar").classList.remove("open")});
try{const saved=localStorage.getItem("cc-theme");if(saved==="light"||saved==="dark")state.theme=saved}catch(e){}
setTheme(state.theme);render();
</script>
</body>
</html>
